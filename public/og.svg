    <rect x="260" y="0" width="280" height="44" rx="22" fill="#0D1117" stroke="#00D4A8" stroke-opacity="0.3"/>
    <text x="282" y="28" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#00D4A8">🔐 On-chain proofs</text>
    <rect x="560" y="0" width="240" height="44" rx="22" fill="#0D1117" stroke="#00D4A8" stroke-opacity="0.3"/>
    <text x="582" y="28" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#00D4A8">🌐 Aptos Shelbynet</text>
