      <stop offset="0%" stop-color="#00D4A8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4A8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D4A8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#060A0E"/>
  <ellipse cx="200" cy="80" rx="500" ry="220" fill="url(#glow)"/>
  <ellipse cx="1000" cy="550" rx="450" ry="200" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(120, 200)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="#0D1117" stroke="#00D4A8" stroke-opacity="0.3"/>
    <path d="M22 42 L60 24 L98 42 L98 84 L60 102 L22 84 Z"
          stroke="#00D4A8" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <circle cx="60" cy="63" r="10" fill="#00D4A8"/>
  </g>

  <!-- Wordmark -->
  <text x="280" y="290" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="700" fill="#F0F6FC">Shelby</text>
  <text x="498" y="290" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="700" fill="#00D4A8">| DRIVE</text>

